<div class="email-component header-component" data-type="header">
    <div class="component-toolbar">
        <button class="edit-btn" title="Edit"><i class="fas fa-edit"></i></button>
        <button class="delete-btn" title="Delete"><i class="fas fa-trash"></i></button>
        <button class="move-up-btn" title="Move Up"><i class="fas fa-arrow-up"></i></button>
        <button class="move-down-btn" title="Move Down"><i class="fas fa-arrow-down"></i></button>
    </div>
    <div class="component-content">
        <h2 style="text-align: center; color: #2c3e50; font-size: 24px; margin: 20px 0; font-family: Arial, sans-serif;">
            Welcome to Our Newsletter
        </h2>
    </div>
</div>

<!-- Header Component Template Properties -->
<template id="header-template-props">
    <div class="property-group">
        <h4>Header Settings</h4>
        <div class="form-group">
            <label>Text Content</label>
            <input type="text" class="header-text" placeholder="Enter header text">
        </div>
        <div class="form-group">
            <label>Alignment</label>
            <select class="header-alignment">
                <option value="left">Left</option>
                <option value="center" selected>Center</option>
                <option value="right">Right</option>
            </select>
        </div>
        <div class="form-group">
            <label>Font Size</label>
            <input type="text" class="header-font-size" placeholder="e.g., 24px" value="24px">
        </div>
        <div class="form-group">
            <label>Font Color</label>
            <div class="color-picker">
                <input type="color" class="header-color" value="#2c3e50">
                <input type="text" class="header-color-text" value="#2c3e50">
            </div>
        </div>
        <div class="form-group">
            <label>Font Family</label>
            <select class="header-font-family">
                <option value="Arial, sans-serif">Arial</option>
                <option value="'Helvetica Neue', sans-serif">Helvetica</option>
                <option value="Georgia, serif">Georgia</option>
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="'Courier New', monospace">Courier New</option>
            </select>
        </div>
        <div class="form-group">
            <label>Padding</label>
            <input type="text" class="header-padding" placeholder="e.g., 20px 0" value="20px 0">
        </div>
        <button class="btn btn-primary update-header-btn" style="width: 100%;">
            <i class="fas fa-check"></i> Update Header
        </button>
    </div>
</template>
