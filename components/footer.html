<!-- Footer Component Template Properties -->
<template id="footer-template-props">
    <div class="property-group">
        <h4>Footer Settings</h4>
        <div class="form-group">
            <label>Copyright Text</label>
            <input type="text" class="footer-copyright" placeholder="© 2024 Your Company" value="© 2024 Your Company. All rights reserved.">
        </div>
        <div class="form-group">
            <label>Alignment</label>
            <select class="footer-alignment">
                <option value="left">Left</option>
                <option value="center" selected>Center</option>
                <option value="right">Right</option>
            </select>
        </div>
        <div class="form-group">
            <label>Font Size</label>
            <input type="text" class="footer-font-size" placeholder="e.g., 12px" value="12px">
        </div>
        <div class="form-group">
            <label>Text Color</label>
            <div class="color-picker">
                <input type="color" class="footer-color" value="#7f8c8d">
                <input type="text" class="footer-color-text" value="#7f8c8d">
            </div>
        </div>
        <div class="form-group">
            <label>Border Top</label>
            <input type="text" class="footer-border" placeholder="e.g., 1px solid #ecf0f1" value="1px solid #ecf0f1">
        </div>
        <div class="form-group">
            <label>Links (separate by comma)</label>
            <input type="text" class="footer-links" placeholder="Unsubscribe, Privacy Policy, Contact Us" value="Unsubscribe, Privacy Policy, Contact Us">
        </div>
        <div class="form-group">
            <label>Link Color</label>
            <div class="color-picker">
                <input type="color" class="footer-link-color" value="#95a5a6">
                <input type="text" class="footer-link-color-text" value="#95a5a6">
            </div>
        </div>
        <div class="form-group">
            <label>Padding</label>
            <input type="text" class="footer-padding" placeholder="e.g., 20px 0" value="20px 0">
        </div>
        <button class="btn btn-primary update-footer-btn" style="width: 100%;">
            <i class="fas fa-check"></i> Update Footer
        </button>
    </div>
</template>
