<div class="email-component text-component" data-type="text">
    <div class="component-toolbar">
        <button class="edit-btn" title="Edit"><i class="fas fa-edit"></i></button>
        <button class="delete-btn" title="Delete"><i class="fas fa-trash"></i></button>
        <button class="move-up-btn" title="Move Up"><i class="fas fa-arrow-up"></i></button>
        <button class="move-down-btn" title="Move Down"><i class="fas fa-arrow-down"></i></button>
    </div>
    <div class="component-content">
        <div style="text-align: left; color: #34495e; font-size: 14px; line-height: 1.6; font-family: Arial, sans-serif; padding: 10px 0;">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.
        </div>
    </div>
</div>

<!-- Text Component Template Properties -->
<template id="text-template-props">
    <div class="property-group">
        <h4>Text Settings</h4>
        <div class="form-group">
            <label>Text Content</label>
            <textarea class="text-content" rows="6" placeholder="Enter your text here...">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</textarea>
        </div>
        <div class="form-group">
            <label>Alignment</label>
            <select class="text-alignment">
                <option value="left" selected>Left</option>
                <option value="center">Center</option>
                <option value="right">Right</option>
                <option value="justify">Justify</option>
            </select>
        </div>
        <div class="form-group">
            <label>Font Size</label>
            <input type="text" class="text-font-size" placeholder="e.g., 14px" value="14px">
        </div>
        <div class="form-group">
            <label>Font Color</label>
            <div class="color-picker">
                <input type="color" class="text-color" value="#34495e">
                <input type="text" class="text-color-text" value="#34495e">
            </div>
        </div>
        <div class="form-group">
            <label>Line Height</label>
            <input type="text" class="text-line-height" placeholder="e.g., 1.6" value="1.6">
        </div>
        <div class="form-group">
            <label>Font Family</label>
            <select class="text-font-family">
                <option value="Arial, sans-serif" selected>Arial</option>
                <option value="'Helvetica Neue', sans-serif">Helvetica</option>
                <option value="Georgia, serif">Georgia</option>
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="'Courier New', monospace">Courier New</option>
            </select>
        </div>
        <div class="form-group">
            <label>Padding</label>
            <input type="text" class="text-padding" placeholder="e.g., 10px 0" value="10px 0">
        </div>
        <button class="btn btn-primary update-text-btn" style="width: 100%;">
            <i class="fas fa-check"></i> Update Text
        </button>
    </div>
</template>
